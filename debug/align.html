<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8" /><title>align</title><style>html,body{margin:0;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body><pre id="tag" style="position:absolute;color:#0f0;z-index:9">…</pre>
<script type="module">
import * as THREE from 'three';
import { loadGLB } from '../js/assets.js';
import { placeEnv } from '../js/env.js';
import { bakeGrid } from '../js/grid.js';
const CELL = 1.5;
(async () => {
  try {
    const gltf = await loadGLB('/assets/models/model-enviroment/source/backrooms.glb');
    const scene = new THREE.Scene(); scene.background = new THREE.Color(0x000010);
    const info = placeEnv(scene, gltf);
    const baked = bakeGrid(info.wallMeshes, info.width, info.depth, CELL, info.ceilY);
    // Mostrar SOLO los wallMeshes (los que el bake usa), en blanco; ocultar lo demás.
    const wallSet = new Set(info.wallMeshes);
    info.root.traverse((o) => { if (o.isMesh) o.visible = wallSet.has(o); });
    for (const w of info.wallMeshes) w.material = new THREE.MeshBasicMaterial({ color: 0xffffff });

    // Overlay rojo del MAP horneado (encima, sin test de profundidad).
    const wallGeo = new THREE.BoxGeometry(CELL, 0.2, CELL);
    const wallMat = new THREE.MeshBasicMaterial({ color: 0xff2222, transparent: true, opacity: 0.5, depthTest: false });
    const cells = [];
    for (let j = 1; j < baked.rows - 1; j++) for (let i = 1; i < baked.cols - 1; i++) if (baked.map[j][i] === 1) cells.push([i, j]);
    const im = new THREE.InstancedMesh(wallGeo, wallMat, cells.length); im.renderOrder = 10;
    const m = new THREE.Matrix4();
    cells.forEach(([i, j], k) => { m.makeTranslation(i * CELL, info.ceilY + 1, j * CELL); im.setMatrixAt(k, m); });
    scene.add(im);

    // Cámara ortográfica cenital, framing exacto [0,W]x[0,D].
    const W = info.width, D = info.depth, S = Math.max(W, D) + 4;
    const cam = new THREE.OrthographicCamera(-S / 2, S / 2, S / 2, -S / 2, 0.1, 100);
    cam.up.set(0, 0, 1);
    cam.position.set(W / 2, 50, D / 2); cam.lookAt(W / 2, 0, D / 2);
    const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(900, 900); document.body.appendChild(renderer.domElement);
    function loop(){ renderer.render(scene, cam); requestAnimationFrame(loop);} loop();
    document.getElementById('tag').textContent = `BLANCO=muros reales, ROJO=MAP horneado. W=${W.toFixed(1)} cols=${baked.cols} walls=${baked.walls}`;
  } catch (e) { document.getElementById('tag').textContent = 'ERROR ' + (e.stack || e); }
})();
</script></body></html>
